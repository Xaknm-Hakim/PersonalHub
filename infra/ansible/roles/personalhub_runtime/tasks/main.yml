---
- name: Install the private production Compose definition
  ansible.builtin.template:
    src: compose.production.yml.j2
    dest: "{{ personalhub_root }}/compose/compose.production.yml"
    owner: root
    group: "{{ personalhub_runtime_group }}"
    mode: "0640"

- name: Install the production environment materializer
  ansible.builtin.copy:
    src: personalhub-materialize-runtime-env.py
    dest: /usr/local/sbin/personalhub-materialize-runtime-env
    owner: root
    group: root
    mode: "0750"

- name: Install the Cloudflare Tunnel token materializer
  ansible.builtin.copy:
    src: personalhub-materialize-cloudflared-token.py
    dest: /usr/local/sbin/personalhub-materialize-cloudflared-token
    owner: root
    group: root
    mode: "0750"

- name: Install the ECR login helper
  ansible.builtin.template:
    src: personalhub-ecr-login.j2
    dest: /usr/local/sbin/personalhub-ecr-login
    owner: root
    group: root
    mode: "0750"

- name: Install the production Compose wrapper
  ansible.builtin.template:
    src: personalhub-compose.j2
    dest: /usr/local/sbin/personalhub-compose
    owner: root
    group: root
    mode: "0750"

- name: Create the protected PostgreSQL backup workspace
  ansible.builtin.file:
    path: "{{ personalhub_backup_work_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the production PostgreSQL backup helper
  ansible.builtin.template:
    src: personalhub-postgres-backup.py.j2
    dest: /usr/local/sbin/personalhub-postgres-backup
    owner: root
    group: root
    mode: "0750"

- name: Install the production PostgreSQL backup service
  ansible.builtin.template:
    src: personalhub-postgres-backup.service.j2
    dest: /etc/systemd/system/personalhub-postgres-backup.service
    owner: root
    group: root
    mode: "0644"
  register: personalhub_runtime_backup_service_unit

- name: Install the production PostgreSQL backup timer
  ansible.builtin.template:
    src: personalhub-postgres-backup.timer.j2
    dest: /etc/systemd/system/personalhub-postgres-backup.timer
    owner: root
    group: root
    mode: "0644"
  register: personalhub_runtime_backup_timer_unit

- name: Reload systemd for PostgreSQL backup unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    personalhub_runtime_backup_service_unit.changed or
    personalhub_runtime_backup_timer_unit.changed

- name: Enable and start the production PostgreSQL backup timer
  ansible.builtin.systemd_service:
    name: personalhub-postgres-backup.timer
    enabled: true
    state: started
