---
- name: Create the Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's official apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_signing_key

- name: Configure Docker's official Ubuntu repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts["distribution_release"] }} stable
  register: docker_apt_repository

- name: Refresh apt metadata after adding Docker repository
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_signing_key.changed or docker_apt_repository.changed

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present

- name: Enable and start Docker Engine
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
