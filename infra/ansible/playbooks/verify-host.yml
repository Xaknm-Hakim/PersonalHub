---
- name: Verify the configured PersonalHub production host
  hosts: personalhub_hosts
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/personalhub_hosts.yml

  tasks:
    - name: Gather service state
      ansible.builtin.service_facts:

    - name: Verify host identity and Docker service
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_version"] == "24.04"
          - ansible_facts["architecture"] == "aarch64"
          - ansible_facts.services["docker.service"].state == "running"
          - ansible_facts.services["docker.service"].status == "enabled"
          - ansible_facts.services["ssh.service"].state == "stopped"
          - ansible_facts.services["ssh.service"].status == "masked"

    - name: Read SSH socket state
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - show
          - --property=ActiveState
          - --property=UnitFileState
          - --value
          - ssh.socket
      register: ssh_socket_state
      changed_when: false

    - name: Verify the SSH socket is inactive and masked
      ansible.builtin.assert:
        that:
          - "'inactive' in ssh_socket_state.stdout_lines"
          - "'masked' in ssh_socket_state.stdout_lines"

    - name: Read runtime-user group membership
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - -nG
          - "{{ personalhub_runtime_user }}"
      register: runtime_user_groups
      changed_when: false

    - name: Read runtime-user password status
      ansible.builtin.command:
        argv:
          - /usr/bin/passwd
          - --status
          - "{{ personalhub_runtime_user }}"
      register: runtime_user_password
      changed_when: false

    - name: Read runtime-user account data
      ansible.builtin.getent:
        database: passwd
        key: "{{ personalhub_runtime_user }}"

    - name: Verify the locked runtime-user design
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd[personalhub_runtime_user][4] == personalhub_root
          - ansible_facts.getent_passwd[personalhub_runtime_user][5] == "/usr/sbin/nologin"
          - "'docker' in runtime_user_groups.stdout.split()"
          - runtime_user_password.stdout.split()[1] == "L"

    - name: Read PersonalHub directory metadata
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - path: /opt/personalhub
          owner: personalhub
          group: personalhub
          mode: "0750"
        - path: /opt/personalhub/compose
          owner: personalhub
          group: personalhub
          mode: "0750"
        - path: /opt/personalhub/deploy
          owner: personalhub
          group: personalhub
          mode: "0750"
        - path: /opt/personalhub/backups
          owner: personalhub
          group: personalhub
          mode: "0750"
        - path: /etc/personalhub
          owner: root
          group: root
          mode: "0700"
      register: personalhub_directories

    - name: Verify PersonalHub directory ownership and modes
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
      loop: "{{ personalhub_directories.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Read Docker Engine version
      ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_version
      changed_when: false

    - name: Read Docker Compose version
      ansible.builtin.command: docker compose version --short
      register: docker_compose_version
      changed_when: false

    - name: Read AWS CLI version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/aws
          - --version
      register: aws_cli_version
      changed_when: false

    - name: List running PersonalHub Compose services
      ansible.builtin.command: >-
        docker ps
        --filter label=com.docker.compose.project=personalhub
        --format '{{ "{{" }}.Label "com.docker.compose.service"{{ "}}" }}'
      register: running_containers
      changed_when: false

    - name: Verify only the production services are running
      ansible.builtin.assert:
        that:
          - running_containers.stdout_lines | sort == ["app", "cloudflared", "postgres"]

    - name: Read production container health and network attachments
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - inspect
          - --format
          - >-
            {{ "{{" }}json .State{{ "}}" }}|{{ "{{" }}json .NetworkSettings.Networks{{ "}}" }}
          - "personalhub-{{ item.service }}-1"
      loop:
        - service: app
          networks:
            - personalhub-production-backend
        - service: postgres
          networks:
            - personalhub-production-backend
        - service: cloudflared
          networks:
            - personalhub-production-backend
            - personalhub-production-edge
      register: production_containers
      changed_when: false

    - name: Verify production container health and network isolation
      ansible.builtin.assert:
        that:
          - (item.stdout.split('|')[0] | from_json).Status == "running"
          - (item.stdout.split('|')[0] | from_json).Health.Status == "healthy"
          - >-
            ((item.stdout.split('|')[1] | from_json | dict2items |
            map(attribute='key') | sort) == (item.item.networks | sort))
      loop: "{{ production_containers.results }}"
      loop_control:
        label: "{{ item.item.service }}"

    - name: Read Cloudflare Tunnel token file metadata
      ansible.builtin.stat:
        path: /etc/personalhub/cloudflared-token
      register: cloudflared_token_file

    - name: Verify Cloudflare Tunnel token file protection
      ansible.builtin.assert:
        that:
          - cloudflared_token_file.stat.isreg
          - cloudflared_token_file.stat.pw_name == "root"
          - cloudflared_token_file.stat.gr_name == "root"
          - cloudflared_token_file.stat.mode == "0600"

    - name: Read production Docker network properties
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - network
          - inspect
          - "{{ item }}"
          - --format
          - '{{ "{{" }}json .Internal{{ "}}" }}'
      loop:
        - personalhub-production-backend
        - personalhub-production-edge
      register: production_networks
      changed_when: false

    - name: Verify backend isolation and edge egress
      ansible.builtin.assert:
        that:
          - production_networks.results[0].stdout == "true"
          - production_networks.results[1].stdout == "false"

    - name: Verify ECR authorization through the instance role
      ansible.builtin.command:
        argv:
          - aws
          - ecr
          - get-login-password
          - --region
          - "{{ personalhub_aws_region }}"
      register: ecr_authorization
      changed_when: false
      no_log: true

    - name: Verify the instance role can request an ECR image manifest
      ansible.builtin.command:
        argv:
          - /usr/local/bin/aws
          - ecr
          - batch-get-image
          - --region
          - "{{ personalhub_aws_region }}"
          - --repository-name
          - "{{ personalhub_ecr_repository }}"
          - --image-ids
          - imageTag=phase2a-readiness
      register: ecr_batch_get
      changed_when: false
      failed_when:
        - ecr_batch_get.rc != 0
        - "'ImageNotFoundException' not in ecr_batch_get.stderr"

    - name: Verify PostgreSQL backup prefix can be listed
      ansible.builtin.command:
        argv:
          - aws
          - s3api
          - list-objects-v2
          - --region
          - "{{ personalhub_aws_region }}"
          - --bucket
          - "{{ personalhub_backup_bucket }}"
          - --prefix
          - postgresql/
          - --max-items
          - "1"
      register: backup_bucket_list
      changed_when: false

    - name: Read listening sockets
      ansible.builtin.command: ss -H -lntup
      register: listening_sockets
      changed_when: false

    - name: Verify management and application ports are not listening
      ansible.builtin.assert:
        that:
          - >-
            listening_sockets.stdout is not
            search(':(?:22|80|443|3000|3001|3002|5432)\\b')

    - name: Check whether Ubuntu requests a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report host verification
      ansible.builtin.debug:
        msg:
          docker_version: "{{ docker_version.stdout }}"
          docker_compose_version: "{{ docker_compose_version.stdout }}"
          aws_cli_version: "{{ aws_cli_version.stdout }}"
          running_containers: "{{ running_containers.stdout_lines }}"
          listening_sockets: "{{ listening_sockets.stdout_lines }}"
          reboot_required: "{{ reboot_required.stat.exists }}"
