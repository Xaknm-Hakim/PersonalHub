name: personalhub-overhaul
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personalhub
      POSTGRES_USER: personalhub
      POSTGRES_PASSWORD: ${PERSONALHUB_POSTGRES_PASSWORD:?set in .env.overhaul}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["personalhub_overhaul_pg:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalhub -d personalhub"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      PERSONALHUB_DATABASE_URL: postgresql://personalhub:${PERSONALHUB_POSTGRES_PASSWORD}@postgres:5432/personalhub?schema=public
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PERSONALHUB_TRUST_PROXY: "false"
    ports: ["0.0.0.0:3002:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  personalhub_overhaul_pg:
